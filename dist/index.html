  <link rel="mask-icon" href="assets/favicon.svg" color="#11251d">
  <link rel="stylesheet" href="styles.css?v=10">
  <script src="app.js?v=9" defer></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "减法书目",
      "headline": "减法书目｜精选书单与阅读推荐",
      "description": "一份经过取舍的精选书单，可按书名、作者和标签搜索，浏览书籍封面、简介与分类。",
      "url": "https://nut.fushengji.top/",
      "inLanguage": "zh-CN",
      "isPartOf": {
        "@type": "WebSite",
        "name": "减法书目",
        "url": "https://nut.fushengji.top/",
        "inLanguage": "zh-CN"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="返回减法书目顶部">
      <img src="assets/logo.svg" alt="减法书目" width="260" height="64">
    </a>
    <p class="header-note">做过减法之后，留下值得重读的书</p>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">THE SHORTLIST</p>
        <h1 id="page-title">书很多，<br><em>留下少数。</em></h1>
      </div>
      <div class="intro-aside">
        <p class="intro-copy">这不是完整藏书，而是经过取舍之后留下的书。按书名、作者或标签，看看哪些作品通过了我的减法筛选。</p>
        <p class="library-stats" aria-live="polite">
          <span>上次新增 <strong id="last-added-count">—</strong> 本</span>
          <span class="stats-divider" aria-hidden="true"></span>
          <span>当前共 <strong id="total-book-count">—</strong> 本</span>
        </p>
      </div>
    </section>

    <section class="library" aria-label="书籍列表">
      <div class="toolbar">
        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <span class="sr-only">搜索书名、作者或标签</span>
          <input id="search" type="search" placeholder="搜索书名、作者或标签" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <button id="randomize" class="toolbar-action randomize is-active" type="button" title="随机显示100本书" aria-pressed="true">随便看看</button>
        <button id="newest-books" class="toolbar-action newest-books" type="button" title="按首次发布到网站的时间显示最新书目" aria-pressed="false">新增书目</button>
      </div>

      <div id="tag-filters" class="tag-filters" aria-label="按标签筛选"></div>
      <div id="book-grid" class="book-grid" aria-live="polite" aria-busy="true"></div>
      <div id="load-sentinel" class="load-sentinel" hidden aria-live="polite">
        <span>继续向下浏览</span>
      </div>
      <nav id="pagination" class="pagination" aria-label="搜索结果分页" hidden></nav>

      <div id="empty-state" class="empty-state" hidden>
        <span aria-hidden="true">∅</span>
        <h2>没有找到相符的书</h2>
        <p>换个书名、作者或标签试试。</p>
        <button id="clear-search" type="button">清除搜索</button>
      </div>
    </section>
  </main>

  <footer>
    <p>减法书目 · 从 Calibre 更新于 <time id="updated-at">—</time></p>
  </footer>

  <dialog id="book-dialog">
    <button class="dialog-close" type="button" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <template id="book-template">
    <article class="book-card">
      <button class="book-open" type="button">
        <div class="cover-wrap">
          <img class="cover" alt="" loading="lazy">
          <div class="cover-placeholder" aria-hidden="true"><span></span><small></small></div>
        </div>
      </button>
      <div class="book-info">
        <button class="book-title-open" type="button"><span class="book-title"></span></button>
        <p class="book-author"></p>
        <div class="book-tags"></div>
      </div>
    </article>
  </template>

  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"3b0d446398244574843d5869bb207367"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
