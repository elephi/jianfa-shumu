<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个来自 Calibre 的私人书单。">
  <meta name="theme-color" content="#101b17">
  <title>读过 · 我的书架</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101b17'/%3E%3Cpath d='M16 15h22c6 0 10 4 10 10v25H24c-5 0-8-3-8-8V15Z' fill='%23f2b84b'/%3E%3Cpath d='M24 15v35M31 25h10M31 32h10' stroke='%23101b17' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="返回书架顶部">
      <span class="brand-mark" aria-hidden="true">读</span>
      <span>读过</span>
    </a>
    <p class="header-note">我的 Calibre 精选书架</p>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">END COLLECTION</p>
        <h1 id="page-title">把读完的书，<br><em>留在这里。</em></h1>
      </div>
      <p class="intro-copy">这是我的已读书单。你可以按书名、作者或标签，找到感兴趣的下一本。</p>
    </section>

    <section class="library" aria-label="书籍列表">
      <div class="toolbar">
        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <span class="sr-only">搜索书名、作者或标签</span>
          <input id="search" type="search" placeholder="搜索书名、作者或标签" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <div class="count" aria-live="polite"><strong id="book-count">—</strong><span>本书</span></div>
      </div>

      <div id="tag-filters" class="tag-filters" aria-label="按标签筛选"></div>
      <div id="book-grid" class="book-grid" aria-live="polite" aria-busy="true"></div>

      <div id="empty-state" class="empty-state" hidden>
        <span aria-hidden="true">∅</span>
        <h2>没有找到相符的书</h2>
        <p>换个书名、作者或标签试试。</p>
        <button id="clear-search" type="button">清除搜索</button>
      </div>
    </section>
  </main>

  <footer>
    <p>从 Calibre 更新 · <time id="updated-at">—</time></p>
  </footer>

  <dialog id="book-dialog">
    <button class="dialog-close" type="button" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <template id="book-template">
    <article class="book-card">
      <button class="book-open" type="button">
        <div class="cover-wrap">
          <img class="cover" alt="" loading="lazy">
          <div class="cover-placeholder" aria-hidden="true"><span></span><small></small></div>
        </div>
        <div class="book-info">
          <h2 class="book-title"></h2>
          <p class="book-author"></p>
          <div class="book-tags"></div>
        </div>
      </button>
    </article>
  </template>
</body>
</html>
